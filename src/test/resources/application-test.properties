# Test profile: in-memory H2 database in MySQL compatibility mode.
# The schema is created fresh for the test run and dropped afterwards.
# To run the same tests against a real MySQL database, override on the command line, e.g.
#   ./mvnw test -Dspring.datasource.url=jdbc:mysql://localhost:3306/login_monitoring_system_test \
#               -Dspring.datasource.username=lams_user -Dspring.datasource.password=...
spring.datasource.url=jdbc:h2:mem:lams_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Tests create their own users; no admin account from the environment
app.admin.email=
app.admin.password=

# Defaults from the specification, fixed for tests
app.security.max-failed-attempts=5
app.security.monitoring-window=10m
app.security.block-duration=15m
app.security.ip-max-accounts=4
app.security.ip-max-failures=10
app.security.account-max-failures=8
app.security.account-min-ips=3
app.security.repeat-block-durations=1h,24h
app.client-ip.render=false
app.client-ip.trusted-proxies=
app.client-ip.headers=
app.display-timezone=UTC

# No calls to outside services from tests
app.integrations.ip-lookup-enabled=false
app.integrations.breach-check-enabled=false
app.integrations.ip-lookup-initial-delay-ms=3600000
