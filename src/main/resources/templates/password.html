<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change Password')}"></head>
<body>
<div th:replace="~{fragments :: header('password', ${isAdmin})}"></div>

<div class="wrapper page">
    <div th:if="${reported}" class="msg msg-warning" th:text="${reported}">Reported.</div>
    <div class="panel form-panel">
        <div class="panel-title">Change Password</div>
        <div class="panel-body">
            <form th:action="@{/account/password}" th:object="${form}" method="post">
                <div class="field">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" th:field="*{currentPassword}" maxlength="128" required
                           autocomplete="current-password"
                           th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error'">
                    <span class="error-text" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                </div>
                <div class="field">
                    <label for="newPassword">New Password <small>(min. 8 characters, letters and numbers)</small></label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" minlength="8" maxlength="64" required
                           autocomplete="new-password" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                    <span class="error-text" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" maxlength="64" required
                           autocomplete="new-password" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                    <span class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
                <div class="buttons">
                    <button type="submit" class="btn">Change Password</button>
                    <a class="btn btn-grey" th:href="@{/dashboard}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
