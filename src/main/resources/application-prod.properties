# Production profile - enable with SPRING_PROFILES_ACTIVE=prod
# All secrets (DB_URL, DB_USERNAME, DB_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD)
# must be provided as environment variables by the hosting platform.

# The site is served over HTTPS, so the session cookie is only sent over HTTPS
server.servlet.session.cookie.secure=true

# Small connection pool for free-tier databases
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.connection-timeout=30000

logging.level.root=INFO
