# =====================================================================
#  Login Attempt Monitoring System - main configuration
#  Values written as ${NAME:default} come from environment variables
#  (or from a local .env file). Never put real secrets in this file.
# =====================================================================
spring.application.name=login-monitoring-system

# Load a local .env file (if present) as extra properties. Real environment variables win.
spring.config.import=optional:file:.env[.properties]

# ---------- Web server ----------
server.port=${PORT:8080}
# Tomcat must NOT rewrite the client address from X-Forwarded-For on its own.
# ClientIpResolver decides which proxies are trusted (see app.security.trusted-proxies).
server.forward-headers-strategy=none
# Send redirects as paths ("/dashboard"), so the browser stays on https behind Render's proxy.
server.tomcat.use-relative-redirects=true

# Never show stack traces or exception messages to users
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ---------- Session cookie ----------
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when the site is served over HTTPS
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---------- MySQL ----------
# Either give the parts (DB_HOST, DB_PORT, DB_NAME, DB_SSL_MODE) or one complete DB_URL.
# DB_SSL_MODE: PREFERRED for a local MySQL, REQUIRED for a cloud database such as Aiven.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:login_monitoring_system}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}}
spring.datasource.username=${DB_USERNAME:lams_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Hibernate creates/updates the three tables automatically on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Health check (used by Docker / hosting platform) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Login protection rules ----------
# Rule 1: failures for ONE account from ONE IP before that pair is locked
app.security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
# Rolling window in which failures are counted, and the length of a first lock / block
app.security.monitoring-window=${MONITORING_WINDOW:10m}
app.security.block-duration=${BLOCK_DURATION:15m}
# Rule 2: different accounts failing from one IP = credential stuffing -> IP blocked
app.security.ip-max-accounts=${IP_MAX_ACCOUNTS:4}
# Rule 3: failures from one IP for any accounts -> IP blocked
app.security.ip-max-failures=${IP_MAX_FAILURES:10}
# Rule 4: failures on one account from at least N different IPs -> account locked for new IPs
app.security.account-max-failures=${ACCOUNT_MAX_FAILURES:8}
app.security.account-min-ips=${ACCOUNT_MIN_IPS:3}
# Rule 5: 2nd, 3rd, ... automatic block of the same IP within 24 h lasts longer
app.security.repeat-block-durations=${REPEAT_BLOCK_DURATIONS:1h,24h}
app.security.repeat-window=24h
# IPs the owner logged in from within this period keep working during a distributed attack
app.security.known-ip-period=90d

# ---------- Client IP detection ----------
# Render sets RENDER=true automatically; the visitor IP is then read from Cloudflare's
# CF-Connecting-IP header. Elsewhere: comma-separated IPs/CIDRs of trusted reverse proxies
# (leave empty when running locally without a proxy).
app.client-ip.render=${RENDER:false}
app.client-ip.trusted-proxies=${TRUSTED_PROXIES:}
app.client-ip.headers=${CLIENT_IP_HEADERS:}

# ---------- Free outside services (no accounts or keys needed) ----------
# Country / city / ISP of visitor IPs via ip-api.com
app.integrations.ip-lookup-enabled=${IP_LOOKUP_ENABLED:true}
# Reject passwords found in data breaches (Have I Been Pwned, k-anonymity)
app.integrations.breach-check-enabled=${BREACH_CHECK_ENABLED:true}
# Login attempts older than this are deleted every night (CERT-In asks for 180 days of logs)
app.integrations.retention=${ATTEMPT_RETENTION:180d}

# ---------- Administrator account (created on startup) ----------
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Time zone used only for DISPLAYING timestamps (storage is always UTC), e.g. Asia/Kolkata
app.display-timezone=${DISPLAY_TIMEZONE:UTC}

# The custom DaoAuthenticationProvider in SecurityConfig is intentional; hide Spring's hint about it
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
